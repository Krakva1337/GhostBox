name: Build GhostBox for Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager 'platforms;android-36' 'ndk;28.2.13676358'
      - name: Build APK and sing-box libbox
        run: ./tool/build_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GhostBox-Android-universal
          path: dist/android/GhostBox-Android-universal.apk
          if-no-files-found: error
          retention-days: 14
