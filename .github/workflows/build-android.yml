name: Build GhostBox for Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK and NDK
        run: |
          for _ in {1..50}; do echo y; done | sdkmanager --licenses
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build unsigned APK and Android cores
        env:
          GHOSTBOX_ANDROID_UNSIGNED: 'true'
        run: ./tool/build_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GhostBox-Android-universal-unsigned
          path: |
            dist/android/GhostBox-Android-universal.apk
            dist/android/GhostBox-Android-universal.apk.sha256
          if-no-files-found: error
          retention-days: 14
