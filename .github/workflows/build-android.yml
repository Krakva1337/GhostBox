name: Build GhostBox for Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK and NDK
        run: |
          for _ in {1..50}; do echo y; done | sdkmanager --licenses
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Configure optional release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "No Android release keystore configured; building a sideloadable debug-signed APK."
            exit 0
          fi
          keystore="$RUNNER_TEMP/ghostbox-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "GHOSTBOX_ANDROID_KEYSTORE_FILE=$keystore"
            echo "GHOSTBOX_ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "GHOSTBOX_ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "GHOSTBOX_ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build APK and sing-box libbox
        run: ./tool/build_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GhostBox-Android-universal
          path: dist/android/GhostBox-Android-universal.apk
          if-no-files-found: error
          retention-days: 14
