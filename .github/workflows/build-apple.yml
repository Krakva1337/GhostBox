name: Build GhostBox for Apple platforms

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS app (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - name: Build macOS app and bundled cores
        run: ./tool/build.sh macos
      - name: Verify app signature
        run: |
          app="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/vendor/bin/sing-box" version
          "$app/Contents/MacOS/vendor/bin/xray" version
          version="$(awk '/^version:/ {split($2, parts, "+"); print parts[1]}' pubspec.yaml)"
          mkdir -p dist
          archive="dist/GhostBox-${version}-macOS-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          shasum -a 256 "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: GhostBox-macOS-${{ matrix.arch }}
          path: |
            dist/GhostBox-*-macOS-${{ matrix.arch }}.zip
            dist/GhostBox-*-macOS-${{ matrix.arch }}.zip.sha256
            tool/install_macos.sh
          if-no-files-found: error
          retention-days: 14
