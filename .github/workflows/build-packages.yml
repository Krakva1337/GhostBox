name: Build GhostBox packages

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a versioned GitHub Release after all platform builds finish (uncheck for artifacts only)
        required: true
        type: boolean
        default: true
      release_summary:
        description: Short update summary shown at the top of the release notes
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  linux-appimage:
    name: Linux ${{ matrix.label }} AppImage
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64
            runner: ubuntu-24.04
            artifact_arch: x86_64
          - label: ARM64
            runner: ubuntu-24.04-arm
            artifact_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        if: matrix.label != 'ARM64'
        with:
          channel: stable
          cache: true
      - name: Bootstrap Flutter stable for the ARM64 host
        if: matrix.label == 'ARM64'
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter-arm64"
          echo "$RUNNER_TEMP/flutter-arm64/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter-arm64/bin/flutter" --version
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Build native Linux AppImage and VPN cores
        run: ./tool/build.sh linux
      - uses: actions/upload-artifact@v4
        with:
          name: GhostBox-Linux-${{ matrix.label }}-AppImage
          path: |
            dist/GhostBox-*-linux-${{ matrix.artifact_arch }}.AppImage
            dist/GhostBox-*-linux-${{ matrix.artifact_arch }}.AppImage.sha256
          if-no-files-found: error
          retention-days: 14

  macos-arm64:
    name: macOS ARM64 app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - name: Build macOS app and bundled cores
        run: ./tool/build.sh macos
      - name: Package and checksum macOS app
        run: |
          app="$(find build/macos/Build/Products/Release -type d -name '*.app' -prune -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/vendor/bin/sing-box" version
          "$app/Contents/MacOS/vendor/bin/xray" version
          version="$(awk '/^version:/ {split($2, parts, "+"); print parts[1]}' pubspec.yaml)"
          archive="dist/GhostBox-${version}-macOS-arm64.zip"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          shasum -a 256 "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: GhostBox-macOS-arm64
          path: |
            dist/GhostBox-*-macOS-arm64.zip
            dist/GhostBox-*-macOS-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  android-apk:
    name: Android universal APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK and NDK
        run: |
          for _ in {1..50}; do echo y; done | sdkmanager --licenses
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Configure optional release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "No Android release keystore configured; building a sideloadable debug-signed APK."
            exit 0
          fi
          keystore="$RUNNER_TEMP/ghostbox-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "GHOSTBOX_ANDROID_KEYSTORE_FILE=$keystore"
            echo "GHOSTBOX_ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "GHOSTBOX_ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "GHOSTBOX_ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build APK and sing-box libbox
        run: ./tool/build_android.sh
      - name: Checksum Android APK
        run: sha256sum dist/android/GhostBox-Android-universal.apk > dist/android/GhostBox-Android-universal.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: GhostBox-Android-universal
          path: |
            dist/android/GhostBox-Android-universal.apk
            dist/android/GhostBox-Android-universal.apk.sha256
          if-no-files-found: error
          retention-days: 14

  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes
      - name: Build GhostBox x64 ZIP, installer and bundled cores
        shell: pwsh
        run: ./tool/build_windows.ps1
      - name: Smoke-check Windows TUN runtime bundle
        shell: pwsh
        run: |
          $release = 'build/windows/x64/runner/Release'
          $application = Join-Path $release 'GhostBox.exe'
          $manifest = Join-Path $env:RUNNER_TEMP 'ghostbox-manifest.xml'
          $wintun = Join-Path $release 'vendor/bin/wintun.dll'
          $singBox = Join-Path $release 'vendor/bin/sing-box.exe'
          if (-not (Test-Path $application)) { throw "Missing app executable: $application" }
          # Windows SDK tools are installed on the runner but are not always on
          # PATH. Resolve the newest x64 Manifest Tool from the SDK explicitly.
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $mt = Get-ChildItem -Path $sdkBin -Directory -ErrorAction SilentlyContinue |
            Sort-Object { try { [version]$_.Name } catch { [version]'0.0' } } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64/mt.exe' } |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1
          if (-not $mt) { throw "Windows SDK Manifest Tool (mt.exe) was not found under: $sdkBin" }
          & $mt "-inputresource:$application;#1" "-out:$manifest"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $manifest)) {
            throw 'Could not inspect the embedded GhostBox application manifest.'
          }
          if ((Get-Content -Raw $manifest) -notmatch 'requestedExecutionLevel[^>]+level="requireAdministrator"') {
            throw 'GhostBox.exe does not request administrator rights for TUN support.'
          }
          $crtDlls = @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll')
          if (-not (Test-Path $wintun)) { throw "Missing bundled TUN runtime: $wintun" }
          if (-not (Test-Path $singBox)) { throw "Missing sing-box core: $singBox" }
          foreach ($dll in $crtDlls) {
            $path = Join-Path $release $dll
            if (-not (Test-Path $path)) { throw "Missing app-local Visual C++ runtime: $path" }
          }
          if (-not (Test-Path (Join-Path $release 'flutter_windows.dll'))) {
            throw 'Missing Flutter Windows runtime DLL.'
          }
          & $singBox version
          if ($LASTEXITCODE -ne 0) { throw "sing-box smoke check failed with exit code $LASTEXITCODE" }
          $zip = Get-ChildItem 'dist/GhostBox-*-Windows-x64.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Missing versioned Windows portable package.' }
          $zip = $zip.FullName
          if (-not (Test-Path $zip)) { throw "Missing Windows portable package: $zip" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            if ($archive.Entries.FullName -notcontains 'vendor/bin/wintun.dll') {
              throw 'Windows ZIP does not contain vendor/bin/wintun.dll'
            }
            foreach ($dll in $crtDlls) {
              if ($archive.Entries.FullName -notcontains $dll) {
                throw "Windows ZIP does not contain app-local runtime DLL $dll"
              }
            }
            if ($archive.Entries.FullName -notcontains 'flutter_windows.dll') {
              throw 'Windows ZIP does not contain flutter_windows.dll'
            }
          } finally {
            $archive.Dispose()
          }
      - name: Create Windows package checksums
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'dist/GhostBox-*-Windows-x64-Setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Missing versioned Windows installer.' }
          $zip = Get-ChildItem 'dist/GhostBox-*-Windows-x64.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Missing versioned Windows portable package.' }
          foreach ($package in @($installer.FullName, $zip.FullName)) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $package).Hash.ToLowerInvariant()
            "$hash *$([System.IO.Path]::GetFileName($package))" | Set-Content -NoNewline -Encoding ascii "$package.sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: GhostBox-Windows-x64
          path: |
            dist/GhostBox-*-Windows-x64-Setup.exe
            dist/GhostBox-*-Windows-x64-Setup.exe.sha256
            dist/GhostBox-*-Windows-x64.zip
            dist/GhostBox-*-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish-alpha-release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: [linux-appimage, macos-arm64, android-apk, windows-x64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: GhostBox-Linux-x86_64-AppImage
          path: dist/linux-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: GhostBox-Linux-ARM64-AppImage
          path: dist/linux-ARM64
      - uses: actions/download-artifact@v4
        with:
          name: GhostBox-Windows-x64
          path: dist/windows-x64
      - uses: actions/download-artifact@v4
        with:
          name: GhostBox-macOS-arm64
          path: dist/macos-arm64
      - uses: actions/download-artifact@v4
        with:
          name: GhostBox-Android-universal
          path: dist/android
      - name: Prepare release notes
        id: release-context
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_SUMMARY: ${{ inputs.release_summary }}
        run: |
          version="$(awk '/^version:/ {split($2, parts, "+"); print parts[1]}' pubspec.yaml)"
          if [[ "$REF_TYPE" == 'tag' && "$REF_NAME" == v* ]]; then
            release_tag="$REF_NAME"
          else
            release_tag="v$version"
          fi
          if git rev-parse --verify --quiet "refs/tags/$release_tag" >/dev/null; then
            tag_commit="$(git rev-parse "${release_tag}^{commit}")"
            tag_summary="$(git for-each-ref --format='%(contents)' "refs/tags/$release_tag")"
            if [[ "$REF_TYPE" != 'tag' && "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Release tag $release_tag already points to another commit; bump pubspec.yaml before publishing." >&2
              exit 1
            fi
          else
            tag_commit="$GITHUB_SHA"
            tag_summary=''
          fi
          summary="${RELEASE_SUMMARY:-$tag_summary}"
          previous_tag="$(git describe --tags --abbrev=0 "$tag_commit^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            changes="$(git log --no-merges --pretty=format:'- %s' "$previous_tag..$tag_commit")"
          else
            changes="$(git log -n 20 --no-merges --pretty=format:'- %s' "$tag_commit")"
          fi
          {
            echo '## Update summary'
            echo
            printf '%s\n' "${summary:-Versioned GhostBox build.}"
            echo
            echo '## Changes'
            echo
            printf '%s\n' "${changes:-See the source commit for details.}"
            echo
            echo '## Built packages'
            echo
            echo '- Linux x86_64 AppImage'
            echo '- Linux ARM64 AppImage'
            echo '- macOS ARM64 app (.zip)'
            echo '- Android universal APK'
            echo '- Windows x64 installer (.exe) and portable ZIP'
            echo
            echo '## Release files'
            echo
            find dist -type f -printf '%P\n' | sort | sed 's/^/- /'
          } > release-notes.md
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-context.outputs.tag }}
        run: |
          args=(--title "GhostBox ${RELEASE_TAG}" --notes-file release-notes.md --target "$GITHUB_SHA")
          if [[ "$RELEASE_TAG" == *alpha* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${args[@]}" \
            dist/linux-x86_64/* dist/linux-ARM64/* dist/windows-x64/* \
            dist/macos-arm64/* dist/android/*
