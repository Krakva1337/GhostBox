name: ghostbox
description: Cross-platform VPN client powered by xray-core and sing-box.
publish_to: 'none'
version: 1.2.0-alpha+4
environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  file_selector: ^1.0.3
  shared_preferences: ^2.5.3
  app_links: ^7.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
flutter:
  uses-material-design: true
  assets:
    - assets/ghostbox_logo.svg
    - assets/ghostbox_logo.png
    - assets/icons/
    - assets/flags/

