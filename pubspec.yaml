name: ghostbox
description: Cross-platform VPN client powered by xray-core and sing-box.
publish_to: 'none'
version: 2.3.2+34
environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  file_selector: ^1.0.3
  ffi: ^2.2.0
  shared_preferences: ^2.5.3
  app_links: ^7.2.2
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
dependency_overrides:
  # shared_preferences_android 2.5.0 switched to its JNI/Pigeon runtime. Keep
  # the channel-based implementation until that runtime is stable on devices.
  shared_preferences_android: 2.4.28
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/flags/
    - assets/fonts/DejaVu-LICENSE.txt
    - dnslists/blacklists/
    - dnslists/routing/
  fonts:
    - family: DejaVu Sans
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
        - asset: assets/fonts/DejaVuSans-Bold.ttf
          weight: 700
    - family: DejaVu Serif
      fonts:
        - asset: assets/fonts/DejaVuSerif.ttf
        - asset: assets/fonts/DejaVuSerif-Bold.ttf
          weight: 700
    - family: DejaVu Sans Mono
      fonts:
        - asset: assets/fonts/DejaVuSansMono.ttf
        - asset: assets/fonts/DejaVuSansMono-Bold.ttf
          weight: 700
